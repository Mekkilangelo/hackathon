services:
  postgres:
    image: postgres:16-alpine
    container_name: sebastian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sebastian
      POSTGRES_PASSWORD: sebastian
      POSTGRES_DB: sebastian_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sebastian -d sebastian_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sebastian_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://sebastian:sebastian@postgres:5432/sebastian_db
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@sebastian.app}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: sebastian_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
