# Compose minimal pour le développement local (DB uniquement)
# Pour lancer l'app complète : docker-compose.yml à la racine du projet

services:
  postgres:
    image: postgres:16-alpine
    container_name: sebastian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sebastian
      POSTGRES_PASSWORD: sebastian
      POSTGRES_DB: sebastian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
