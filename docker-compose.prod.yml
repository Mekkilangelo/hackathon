version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sebastian_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sebastian}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-sebastian_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sebastian} -d ${DB_NAME:-sebastian_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - sebastian_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sebastian_backend_prod
    restart: always
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-sebastian}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-sebastian_db}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - sebastian_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: sebastian_frontend_prod
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
      - NET_RAW
    networks:
      - sebastian_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: sebastian_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
      - NET_RAW
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - sebastian_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  sebastian_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
